<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cidade - Multimédia</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>A minha Cidade - Multimédia</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="local.html">Localização</a>
            <a href="multimedia.html">Multimédia</a>
            <a href="info.html">Informação</a>
        </nav>
    </header>

    <main>
        <!-- Ponto 2: Nova secção com fotografia emblemática e frase sobreposta -->
        <section id="banner-cidade">
            <img src="images/cidade.png" alt="Fotografia Emblemática da Cidade">
            <h2>Santorini: A Pérola do Egeu</h2>
        </section>

        <!-- Secção de Fotografias / Galeria -->
        <section id="galeria">
            <h2>Galeria de Fotografias</h2>
            <img src="images/oia.jpeg" alt="Vila de Oia">
            <img src="images/Fira.jpeg" alt="Fira ao anoitecer">
            <img src="images/Imerovigli.jpeg" alt="Imerovigli e a caldeira">
            <img src="images/Red Beach.jpeg" alt="Praia Vermelha (Red Beach)">
            <img src="images/nea-kameni.jpeg" alt="Vulcão de Nea Kameni">
            <img src="images/Farol de Akrotiri.jpeg" alt="Farol de Akrotiri">
            <img src="images/Pyrgos.jpeg" alt="Vila tradicional de Pyrgos">
            <img src="images/Castelo de Oia.jpeg" alt="Castelo de Oia">
        </section>

        <!-- Secção de Vídeo -->
        <section id="video">
            <h2>Vídeo</h2>
            <p>Vídeo promocional da região.</p>
        </section>

        <!-- Secção de Poesia -->
        <section id="poesia">
            <h2>Poesia</h2>
            <p>Entre o azul do céu e o mar sem fim.</p>
            <p>Erguem-se as casas brancas do jardim.</p>
        </section>
    </main>

    <footer>
        <p>DIW 2026</p>
    </footer>

</body>
</html>
