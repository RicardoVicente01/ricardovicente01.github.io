<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 4 - 5 Eventos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Página "artilhada" com 5 Eventos</h1>
        <nav>
            <a href="../index.html">Home</a>
        </nav>
    </header>

    <main>
        <!-- 1. Passa por aqui! (mouseover / mouseout) -->
        <section>
            <p id="texto-passa">1. Passa por aqui!</p>
        </section>

        <!-- 2. Pinta-me! (click em Red, Green, Blue) -->
        <section>
            <p>
                <span id="titulo-pinta">2. Pinta-me!</span>
                <button id="button-red">Red</button>
                <button id="button-green">Green</button>
                <button id="button-blue">Blue</button>
            </p>
        </section>

        <!-- 3. Experimenta escrever... (input) -->
        <section>
            <p>
                3. Experimenta escrever...
                <input type="text" id="input-escrever">
            </p>
        </section>

        <!-- 4. Escolha uma cor em inglês (submeter cor) -->
        <section>
            <p>
                4. Escolha uma cor em inglês:
                <input type="text" id="input-cor">
                <button id="button-submeter">submeter</button>
            </p>
        </section>

        <!-- 5. Conta! -->
        <section>
            <p>
                5. <button id="button-conta">Conta!</button>
                <span id="valor-contador">33</span>
            </p>
        </section>
    </main>

    <footer>
        <p>DIW 2026</p>
    </footer>

    <!-- Script no final do body por boas práticas -->
    <script src="scripts/main.js"></script>
</body>
</html>
