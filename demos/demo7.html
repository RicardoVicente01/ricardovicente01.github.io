<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo 7 - Layout Responsivo com Media Query</title>
    <link rel="stylesheet" href="../styles.css" />
    <style>
      /* Estilos específicos da Demonstração 7 */
      .demo-contentor-resp {
        display: grid;
        height: 500px;
        background-color: dodgerblue;
        padding: 10px;
        gap: 10px;
        grid-template-areas:
          "header header header"
          "menu main info"
          "menu footer footer";
        grid-template-columns: 20vw 3fr 1fr;
        grid-template-rows: 15vh 1fr 60px;
        margin: 20px 0;
      }

      .demo-contentor-resp > * {
        background-color: white;
        color: black;
        border: 1px solid black;
        padding: 10px;
      }

      .demo-header-resp { grid-area: header; }
      .demo-menu-resp { grid-area: menu; }
      .demo-main-resp { grid-area: main; }
      .demo-info-resp { grid-area: info; }
      .demo-footer-resp { grid-area: footer; }

      /* Media Query para ecrãs até 600px (ex: telemóvel) */
      @media (max-width: 600px) {
        .demo-contentor-resp {
          height: 900px;
          background-color: khaki;
          grid-template-areas:
            "header"
            "menu"
            "main"
            "aside"
            "footer";
          grid-template-columns: 1fr;
          grid-template-rows: auto;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Demonstração 7: Media Queries</h1>
      <p>Desenvolvido por: Ricardo Vicente</p>
      <nav>
        <a href="demos.html">Voltar às Demos</a>
      </nav>
    </header>

    <main>
      <section>
        <h2>Exemplo de Responsividade com Grid</h2>
        <p>Redimensiona a janela abaixo de 600px para ver a adaptação do layout:</p>

        <div class="demo-contentor-resp">
          <header class="demo-header-resp">Cabeçalho</header>
          <nav class="demo-menu-resp">Menu</nav>
          <main class="demo-main-resp">Conteúdo Principal</main>
          <aside class="demo-info-resp">Informação</aside>
          <footer class="demo-footer-resp">Rodapé</footer>
        </div>
      </section>
    </main>

    <footer>
      <p>DIW 2026 - Demos</p>
    </footer>
  </body>
</html>
