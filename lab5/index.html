<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 5 - Eventos 2.0</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Página "artilhada" com Eventos 2.0</h1>
        <nav>
            <a href="../index.html">Home</a>
        </nav>
    </header>

    <main>
        <!-- 1. Passa por aqui! -->
        <section>
            <p id="texto-passa">1. Passa por aqui!</p>
        </section>

        <!-- 2. Pinta-me (com data-color e querySelectorAll) -->
        <section>
            <p>
                <span id="titulo-pinta">2. Pinta-me</span>
                <button class="color" data-color="red">Red</button>
                <button class="color" data-color="green">Green</button>
                <button class="color" data-color="blue">Blue</button>
            </p>
        </section>

        <!-- 3. Experimenta escrever... -->
        <section>
            <p>
                3. Experimenta escrever...
                <br>
                <input type="text" id="input-escrever">
            </p>
        </section>

        <!-- 4. Escolha uma cor (com select e this) -->
        <section>
            <p>
                4. Escolha uma cor:
                <select id="select-cor">
                    <option value="white">White</option>
                    <option value="red">Red</option>
                    <option value="blue">Blue</option>
                </select>
            </p>
        </section>

        <!-- 5. Conta! -->
        <section>
            <p>
                5. <button id="button-conta">Conta!</button>
                <span id="valor-contador">72</span>
            </p>
        </section>

        <!-- 6. Formulário com onsubmit -->
        <section>
            <form>
                6.
                <input type="text" id="input-nome" placeholder="insira o seu nome">
                <input type="text" id="input-idade" placeholder="insira a sua idade">
                <input type="submit" value="Submit">
            </form>
            <p id="mensagem-dados"></p>
        </section>

        <!-- 7. Automatic Counter com setInterval -->
        <section>
            <p>
                7. Automatic Counter: <span id="auto-contador">0</span>
            </p>
        </section>

        <!-- Contador Avançado com Local Storage -->
        <section>
            <h2>Contador Local Storage</h2>
            <p>Valor atual: <span id="contador-valor">0</span></p>
            <button id="btn-incrementar">Incrementar</button>
            <button id="btn-decrementar">Decrementar</button>
            <button id="btn-reset">Reset</button>
        </section>
    </main>

    <footer>
        <p>DIW 2026</p>
    </footer>

    <!-- Script no final do body -->
    <script src="scripts/main.js"></script>
</body>
</html>
