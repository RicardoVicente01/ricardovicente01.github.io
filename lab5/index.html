<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 5 - Eventos 1.0</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            line-height: 1.6;
        }
        button {
            padding: 6px 12px;
            margin-right: 5px;
            cursor: pointer;
        }
        input[type="text"] {
            padding: 6px;
            font-size: 14px;
        }
        .flex-container {
            height: 200px;
            background-color: #e0e0e0;
            display: flex;
            flex-direction: row; /* valor inicial */
            align-items: center;
            gap: 10px;
            margin-top: 15px;
            padding: 10px;
        }
        .bola {
            width: 30px;
            height: 30px;
            background-color: #3498db;
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <!-- 1. Evento de clique / alteração num elemento (Título) -->
    <h1 id="titulo">Passa por aqui!</h1>

    <!-- 2. Eventos do rato (Botões de cores com data-attributes) -->
    <div>
        <button class="color" data-color="lightcoral">Red</button>
        <button class="color" data-color="plum">Purple</button>
        <button class="color" data-color="moccasin">Orange</button>
    </div>

    <br>

    <!-- 3. Evento de seleção (Select com cores e uso do this) -->
    <p>4. Escolha uma cor:
        <select id="select-cores">
            <option value="white">White</option>
            <option value="lightcoral">Red</option>
            <option value="lightblue">Blue</option>
        </select>
    </p>

    <!-- 4. Evento de formulário (Submit) -->
    <form id="meu-formulario">
        <input type="text" id="nome-utilizador" placeholder="Nome" required>
        <button type="submit">Submeter</button>
    </form>
    <h2 id="saudacao"></h2>

    <!-- 5. Contador simples -->
    <h1 id="contador-display">0</h1>
    <button id="btn-conta">Conta!</button>

    <!-- 6. Exercício Select Flex -->
    <h2>6. Controlo de Flexbox com Select</h2>
    <select id="select-flex">
        <option value="row">row</option>
        <option value="row-reverse">row-reverse</option>
        <option value="column">column</option>
        <option value="column-reverse">column-reverse</option>
    </select>

    <div class="flex-container">
        <div class="bola"></div>
        <div class="bola"></div>
        <div class="bola"></div>
        <div class="bola"></div>
    </div>

    <script>
        // --- Evento 1: Clique no título para mudar texto e cor ---
        const titulo = document.querySelector('#titulo');
        titulo.addEventListener('click', () => {
            if (titulo.textContent === "Passa por aqui!") {
                titulo.textContent = "Bem-vindo ao Lab 5!";
                titulo.style.color = "blue";
            } else {
                titulo.textContent = "Passa por aqui!";
                titulo.style.color = "black";
            }
        });

        // --- Evento 2: Cliques nos botões de cores (com querySelectorAll, forEach e dataset) ---
        document.querySelectorAll("button.color").forEach((button) => {
            button.addEventListener('click', () => {
                document.body.style.backgroundColor = button.dataset.color;
            });
        });

        // --- Evento 3: Mudança de cor através de um <select> usando 'this' ---
        document.querySelector('#select-cores').addEventListener('change', function() {
            document.body.style.backgroundColor = this.value;
        });

        // --- Evento 4: Submissão de formulário (onsubmit) ---
        const formulario = document.querySelector('#meu-formulario');
        const inputNome = document.querySelector('#nome-utilizador');
        const saudacao = document.querySelector('#saudacao');

        formulario.addEventListener('submit', (evento) => {
            evento.preventDefault();
            saudacao.textContent = `Olá, ${inputNome.value}!`;
        });

        // --- Evento 5: Contador dinâmico ---
        const btnConta = document.querySelector('#btn-conta');
        const contadorDisplay = document.querySelector('#contador-display');
        let contador = 0;

        btnConta.addEventListener('click', () => {
            contador++;
            contadorDisplay.textContent = contador;
        });

        // --- Evento 6: Controlo de Flexbox com Select e 'this' ---
        document.querySelector('#select-flex').addEventListener('change', function() {
            document.querySelector('.flex-container').style.flexDirection = this.value;
        });
    </script>

</body>
</html>
